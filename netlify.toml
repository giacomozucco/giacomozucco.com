[build]
  command = "npm ci --no-audit --no-fund && npm run build"
  publish = "_site"

[build.environment]
  # Eleventy 3 needs Node 18 or newer
  NODE_VERSION = "20"

# Old VuePress URLs. Article URLs are unchanged (/<slug>/); these cover the
# list and tag pages that no longer exist.
[[redirects]]
  from = "/articles/*"
  to = "/content/"
  status = 301

[[redirects]]
  from = "/tag/*"
  to = "/content/"
  status = 301

[[redirects]]
  from = "/test/"
  to = "/"
  status = 301

[[redirects]]
  from = "/test"
  to = "/"
  status = 301

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Privacy and security headers for every page. The site loads nothing from
# third parties: no cookies, no analytics, no external fonts, scripts, images
# or embeds. The CSP below enforces that in the browser.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; connect-src 'none'; frame-src 'none'; frame-ancestors 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; upgrade-insecure-requests"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), browsing-topics=(), camera=(), clipboard-read=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), interest-cohort=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-DNS-Prefetch-Control = "off"
