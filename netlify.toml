[build]
  command = "npm ci --no-audit --no-fund && npm run build"
  publish = "_site"

[build.environment]
  # Eleventy 3 needs Node 18 or newer
  NODE_VERSION = "20"

# Old VuePress URLs. Article URLs are unchanged (/<slug>/); these cover the
# list and tag pages that no longer exist.
[[redirects]]
  from = "/articles/*"
  to = "/content/"
  status = 301

[[redirects]]
  from = "/tag/*"
  to = "/content/"
  status = 301

[[redirects]]
  from = "/test/"
  to = "/"
  status = 301

[[redirects]]
  from = "/test"
  to = "/"
  status = 301

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
